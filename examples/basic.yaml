listeners:
  - name: demo
    bind: 127.0.0.1:19000
    backends: [127.0.0.1:19001, 127.0.0.1:19002]
    balance: round_robin
    session_timeout: 60s
    health_check:
      mode: raw
      payload: "70696e67" # "ping"
      interval: 5s
      timeout: 1s
      rise: 2
      fall: 3

sessions:
  timeout: 60s
  max: 0

admin:
  bind: 127.0.0.1:9155

logging:
  level: debug
  format: text

# Per-request log (defaults shown; the section may be omitted entirely).
request_log:
  enabled: true
  dir: /var/log/udpshunt
  retention_days: 30

# Per-client-IP stats for the TUI/WebUI clients view (defaults shown).
client_stats:
  enabled: true
  dir: /var/log/udpshunt
  retention_days: 30
  max_ips: 65536
  snapshot_interval: 60s
