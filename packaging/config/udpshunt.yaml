# Starter config installed to /etc/udpshunt/udpshunt.yaml.
# Safe demo: loopback only. Replace backends and bind for real use.
listeners:
  - name: demo
    bind: 127.0.0.1:19000
    backends: [127.0.0.1:19001, 127.0.0.1:19002]
    balance: round_robin
    session_timeout: 60s
    # What happens to a downed backend's live sessions:
    # close (default): terminate them immediately; drain: let them
    # expire via session_timeout.
    on_down: close
    health_check:
      mode: raw
      payload: "70696e67" # "ping"
      interval: 5s
      timeout: 1s
      rise: 2
      fall: 3

sessions:
  timeout: 60s
  max: 0

admin:
  bind: 127.0.0.1:9155

# Per-request log: one JSON line per client packet, one file per day,
# gzip on rollover, files older than retention_days deleted.
# Defaults when the section is absent: enabled, /var/log/udpshunt, 30 days.
request_log:
  enabled: true
  dir: /var/log/udpshunt
  retention_days: 30

# Per-client-IP statistics: live counts/rates in the TUI and web UI,
# snapshot file per day in dir (same rotation/retention as request_log).
# Defaults when the section is absent: enabled, /var/log/udpshunt,
# 30 days, 65536 IPs, 60s snapshots.
client_stats:
  enabled: true
  dir: /var/log/udpshunt
  retention_days: 30
  max_ips: 65536
  snapshot_interval: 60s

logging:
  level: info
  format: text

# Client IP blacklist (optional): packets from listed clients are dropped
# silently before forwarding. Entries are exact IPs or CIDR prefixes.
# blacklist:
#   entries: # inline list, unioned with the file below
#     - 203.0.113.7
#     - 198.51.100.0/24
#   file: /etc/udpshunt/blacklist.txt # comma- or newline-separated entries;
#                                      # the admin API writes through to this
#                                      # file (persistent across restarts)
#   watch_interval: 5s # poll the file for changes; 0 disables watching
#   log_blocked: false # request-log one line PER dropped packet (loud under attack)
